name: gravel scout

# No schedule: this runs when somebody presses the button, and not otherwise.
#
# A scheduled run here only ever sees KupujemProdajem - the other four boards
# turn down a datacentre address - so it was doing a fraction of the work of a
# run from a phone on a Serbian network, while filling the issue list on its
# own initiative.  The button stays, because a run from here needs no laptop
# and no phone, and it runs the tests on the way past.
on:
  workflow_dispatch:
    inputs:
      notify:
        description: "Open an issue / ping Telegram for each new hit"
        type: boolean
        # Off by default now that nothing here runs unattended: a run from this
        # button should report into its own log, not into the issue list.
        default: false

permissions:
  contents: write   # to commit the updated state file
  issues: write     # one issue per new candidate

concurrency:
  group: gravel-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the offline tests first
        run: python tests/test_scout.py

      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m gravelscout run \
            ${{ (github.event_name == 'workflow_dispatch' && !inputs.notify) && '--no-notify' || '' }}

      - name: Commit what changed
        run: |
          git config user.name  "gravel-scout"
          git config user.email "gravel-scout@users.noreply.github.com"
          git add data/seen.json out/ || true
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "scout: $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((2 ** i))
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shortlist
          path: |
            out/
            debug/
          if-no-files-found: ignore
          retention-days: 14
